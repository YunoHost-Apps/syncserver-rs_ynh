        amd64.sha256 = "d16352bf44fc7676dcd14d554f811deaa84184b782c11faf326b659bc631307c"
        autoupdate.asset.amd64 = "diesel-v\\d+(\\.\\d+)+-bookworm-x86_64-unknown-linux-gnu.zst"

