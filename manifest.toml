#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "syncserver-rs"
name = "Firefox SyncStorage"

description.en = "Synchronize tabs, passwords, history etc. between your Firefox instances"
description.fr = "Synchronisez for onglets, mot de passe, historique etc entre vos Firefox"

version = "0.22.3~ynh5"

maintainers = ["orhtej2"]

[upstream]
license = "MPL-2.0"
website = "https://www.mozilla.org/en-GB/firefox/features/sync/"
admindoc = "https://github.com/mozilla-services/syncstorage-rs/blob/master/docs/config.md"
code = "https://github.com/mozilla-services/syncstorage-rs"
fund = "https://donate.mozilla.org/en-GB/"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

sso = false
ldap = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

[resources]

    [resources.sources]
        [resources.sources.main]
        url = "https://github.com/mozilla-services/syncstorage-rs/archive/refs/tags/0.22.3.tar.gz"
        sha256 = "f328e4ba64ceeaf0c0abdece005d2bd572d38abfcf2aa9c453bc475e1c8201d2"
        autoupdate.strategy = "latest_github_tag"
        autoupdate.needs_manual_tweaks = true

        [resources.sources.bookworm]
        amd64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.22.3/syncserver-0.22.3-bookworm-x86_64-unknown-linux-gnu.zst"
        amd64.sha256 = "a5d2d011a6d28b6c1029ca9b111c8fda29991356d0c71f7114c77ee5cadfbcbe"
        autoupdate.asset.amd64 = "syncserver-\\d+(\\.\\d+)+-bookworm-x86_64-unknown-linux-gnu.zst"

        arm64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.22.3/syncserver-0.22.3-bookworm-aarch64-unknown-linux-gnu.zst"
        arm64.sha256 = "cb06a9f143ba8d1872f13882550d5746f6fa23ab1f379c54dd291cc40abe6e7e"
        autoupdate.asset.arm64 = "syncserver-\\d+(\\.\\d+)+-bookworm-aarch64-unknown-linux-gnu.zst"

        armhf.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.22.3/syncserver-0.22.3-bookworm-armv7-unknown-linux-gnueabihf.zst"
        armhf.sha256 = "d05963c6273b64fe7388dde2401eb352ce871c829ea91506f899c0057121b9cf"
        autoupdate.asset.armhf = "syncserver-\\d+(\\.\\d+)+-bookworm-armv7-unknown-linux-gnueabihf.zst"

        autoupdate.strategy = "latest_github_release"
        autoupdate.upstream = "https://github.com/YunoHost-Apps/syncstorage-rs-build"
        autoupdate.needs_manual_tweaks = true
        autoupdate.version_regex = "syncserver-(\\d+\\.\\d+\\.\\d+\\.?\\d{0,})"
        rename = "syncserver"
        in_subdir = false
        prefetch = false

        [resources.sources.trixie]
        amd64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.22.3/syncserver-0.22.3-trixie-x86_64-unknown-linux-gnu.zst"
        amd64.sha256 = "d5a160523ce4fbabaf488e10a528543e93293773b5d41d39e71b7ce3b3378a67"
        autoupdate.asset.amd64 = "syncserver-\\d+(\\.\\d+)+-trixie-x86_64-unknown-linux-gnu.zst"

        arm64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.22.3/syncserver-0.22.3-trixie-aarch64-unknown-linux-gnu.zst"
        arm64.sha256 = "85d83bc998a219f683488128312af01df7b3c5a55e0ab76c0a5fb5000d57aca8"
        autoupdate.asset.arm64 = "syncserver-\\d+(\\.\\d+)+-trixie-aarch64-unknown-linux-gnu.zst"

        armhf.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.22.3/syncserver-0.22.3-trixie-armv7-unknown-linux-gnueabihf.zst"
        armhf.sha256 = "208843cc9eb067a2debae6106bd1bca04a800ade390399d47c347057ea04a5a5"
        autoupdate.asset.armhf = "syncserver-\\d+(\\.\\d+)+-trixie-armv7-unknown-linux-gnueabihf.zst"

        autoupdate.strategy = "latest_github_release"
        autoupdate.upstream = "https://github.com/YunoHost-Apps/syncstorage-rs-build"
        autoupdate.needs_manual_tweaks = true
        autoupdate.version_regex = "syncserver-(\\d+\\.\\d+\\.\\d+\\.?\\d{0,})"
        rename = "syncserver"
        in_subdir = false
        prefetch = false

        [resources.sources.diesel]
        amd64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/diesel-v2.3.7/diesel-v2.3.7-bookworm-x86_64-unknown-linux-gnu.zst"
        amd64.sha256 = "e931f3cdbe29a6f2cc66eea099d2955efe029643e524438b70a3f7763c74b328"
        autoupdate.asset.amd64 = "diesel-v\\d+(\\.\\d+)+-bookworm-x86_64-unknown-linux-gnu.zst"

        arm64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/diesel-v2.3.7/diesel-v2.3.7-bookworm-aarch64-unknown-linux-gnu.zst"
        arm64.sha256 = "7cbd639cf45ab9530d9b6a3604a94f34ae83646fdf6d3f29c72e96f256d8b3c3"
        autoupdate.asset.arm64 = "diesel-v\\d+(\\.\\d+)+-bookworm-aarch64-unknown-linux-gnu.zst"

        armhf.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/diesel-v2.3.7/diesel-v2.3.7-bookworm-armv7-unknown-linux-gnueabihf.zst"
        armhf.sha256 = "64e5c0c3658ed2a3cce9478e0ba7e8dc1f38f3cf8b59d45e11819d3a51988920"
        autoupdate.asset.armhf = "diesel-v\\d+(\\.\\d+)+-bookworm-armv7-unknown-linux-gnueabihf.zst"

        autoupdate.strategy = "latest_github_release"
        autoupdate.upstream = "https://github.com/YunoHost-Apps/syncstorage-rs-build"
        autoupdate.needs_manual_tweaks = true
        autoupdate.version_regex = "diesel-v(\\d+\\.\\d+\\.\\d+)"
        rename = "diesel"
        in_subdir = false

        [resources.sources.uv]
        amd64.url = "https://github.com/astral-sh/uv/releases/download/0.11.10/uv-x86_64-unknown-linux-gnu.tar.gz"
        amd64.sha256 = "077e1a0777bcf516e02f4ef245e269c8d1baa780438e4c50e09c5c997f85538a"
        arm64.url = "https://github.com/astral-sh/uv/releases/download/0.11.10/uv-aarch64-unknown-linux-gnu.tar.gz"
        arm64.sha256 = "91d5f4583539640765662ef86edcf3bf4db07439b622c7bed50c961240162046"
        armhf.url = "https://github.com/astral-sh/uv/releases/download/0.11.10/uv-armv7-unknown-linux-gnueabihf.tar.gz"
        armhf.sha256 = "ba259f6c14b5653f1b36400fb8c7862e499a4537201edda76991f2b044014fdb"

        in_subdir = true

        autoupdate.strategy = "latest_github_release"
        autoupdate.upstream = "https://github.com/astral-sh/uv"
        autoupdate.asset.amd64 = "^uv-x86_64-unknown-linux-gnu.tar.gz$"
        autoupdate.asset.arm64 = "^uv-aarch64-unknown-linux-gnu.tar.gz$"
        autoupdate.asset.armhf = "^uv-armv7-unknown-linux-gnueabihf.tar.gz$"


    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
    main.show_tile = false
    main.allowed = "visitors"
    main.protected = true

    [resources.ports]

    [resources.apt]
    packages = [
      "mariadb-server",
      "libmariadb-dev-compat", 
      "build-essential",
      "libssl-dev",
      "libcurl4",
      "pkg-config",
      "python3-dev"
    ]

    [resources.database]
    type = "mysql"
