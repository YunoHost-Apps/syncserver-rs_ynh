    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
    main.show_tile = false
    main.allowed = "visitors"
    main.protected = true

    [resources.ports]

    [resources.apt]
    packages = [
      "mariadb-server",
      "libmariadb-dev-compat", 
      "python3-pip",
      "python3-setuptools",
      "python3-wheel",
      "build-essential",
      "libssl-dev",
      "libcurl4",
      "python3-venv",
      "pkg-config"
    ]

    [resources.database]
    type = "mysql"
