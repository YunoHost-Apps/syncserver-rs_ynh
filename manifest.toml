#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "syncserver-rs"
name = "Firefox SyncStorage"

description.en = "Synchronize tabs, passwords, history etc. between your Firefox instances"
description.fr = "Synchronisez for onglets, mot de passe, historique etc entre vos Firefox"

version = "0.25.0~ynh1"

maintainers = ["orhtej2"]

[upstream]
license = "MPL-2.0"
website = "https://www.mozilla.org/en-GB/firefox/features/sync/"
admindoc = "https://github.com/mozilla-services/syncstorage-rs/blob/master/docs/config.md"
code = "https://github.com/mozilla-services/syncstorage-rs"
fund = "https://donate.mozilla.org/en-GB/"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

sso = false
ldap = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

[resources]

    [resources.sources]
        [resources.sources.main]
        url = "https://github.com/mozilla-services/syncstorage-rs/archive/refs/tags/0.25.0.tar.gz"
        sha256 = "09f87a9961704590cecf79cd55fe15def8e9e5a2e75fe88c6b35acb80117b62d"
        autoupdate.strategy = "latest_github_tag"
        autoupdate.needs_manual_tweaks = true

        [resources.sources.bookworm]
        amd64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.24.1-postgres/syncserver-0.24.1-bookworm-x86_64-unknown-linux-gnu.zst"
        amd64.sha256 = "9525a29328a02ad0918534c2652e6f7748fff2466a4330a0d980a60d82b3ec59"
        autoupdate.asset.amd64 = "syncserver-\\d+(\\.\\d+)+-bookworm-x86_64-unknown-linux-gnu.zst"

        arm64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.24.1-postgres/syncserver-0.24.1-bookworm-aarch64-unknown-linux-gnu.zst"
        arm64.sha256 = "d9f7fc19eb724a3112784c9cfd4f174600c3c245210fb8d3f2c63f9688baf249"
        autoupdate.asset.arm64 = "syncserver-\\d+(\\.\\d+)+-bookworm-aarch64-unknown-linux-gnu.zst"

        armhf.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.24.1-postgres/syncserver-0.24.1-bookworm-armv7-unknown-linux-gnueabihf.zst"
        armhf.sha256 = "369dfe281e9bf21248a021e85e8f731c429ec34a5e7e10051443748786f71907"
        autoupdate.asset.armhf = "syncserver-\\d+(\\.\\d+)+-bookworm-armv7-unknown-linux-gnueabihf.zst"

        autoupdate.strategy = "latest_github_release"
        autoupdate.upstream = "https://github.com/YunoHost-Apps/syncstorage-rs-build"
        autoupdate.needs_manual_tweaks = true
        autoupdate.version_regex = "syncserver-(\\d+\\.\\d+\\.\\d+\\.?\\d{0,})-postgres"
        rename = "syncserver"
        in_subdir = false
        prefetch = false

        [resources.sources.trixie]
        amd64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.24.1-postgres/syncserver-0.24.1-trixie-x86_64-unknown-linux-gnu.zst"
        amd64.sha256 = "bda16116b45bf9c2a0e96cfcb68173f7c6a1dba664633711509556b0e41320a4"
        autoupdate.asset.amd64 = "syncserver-\\d+(\\.\\d+)+-trixie-x86_64-unknown-linux-gnu.zst"

        arm64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.24.1-postgres/syncserver-0.24.1-trixie-aarch64-unknown-linux-gnu.zst"
        arm64.sha256 = "ca02fc3fa036cdb9817eaec9cfcb78b067052a678926f5c4cfcb40658983e55a"
        autoupdate.asset.arm64 = "syncserver-\\d+(\\.\\d+)+-trixie-aarch64-unknown-linux-gnu.zst"

        armhf.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.24.1-postgres/syncserver-0.24.1-trixie-armv7-unknown-linux-gnueabihf.zst"
        armhf.sha256 = "8fa855e2325740a37d394dd16e861ea3135d7ee56fc272e302c18ed3ec1e046a"
        autoupdate.asset.armhf = "syncserver-\\d+(\\.\\d+)+-trixie-armv7-unknown-linux-gnueabihf.zst"

        autoupdate.strategy = "latest_github_release"
        autoupdate.upstream = "https://github.com/YunoHost-Apps/syncstorage-rs-build"
        autoupdate.needs_manual_tweaks = true
        autoupdate.version_regex = "syncserver-(\\d+\\.\\d+\\.\\d+\\.?\\d{0,})-postgres"
        rename = "syncserver"
        in_subdir = false
        prefetch = false

        [resources.sources.diesel]
        amd64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/diesel-v2.3.14-postgres/diesel-v2.3.14-bookworm-x86_64-unknown-linux-gnu.zst"
        amd64.sha256 = "ec7eae2961be2ba32af1517da53e679fe8ed2bc8e5139ed890b3b39815d080a0"
        autoupdate.asset.amd64 = "diesel-v\\d+(\\.\\d+)+-bookworm-x86_64-unknown-linux-gnu.zst"

