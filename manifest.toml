#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "syncserver-rs"
name = "Firefox SyncStorage"

description.en = "Synchronize tabs, passwords, history etc. between your Firefox instances"
description.fr = "Synchronisez for onglets, mot de passe, historique etc entre vos Firefox"

version = "0.23.2~ynh1"

maintainers = ["orhtej2"]

[upstream]
license = "MPL-2.0"
website = "https://www.mozilla.org/en-GB/firefox/features/sync/"
admindoc = "https://github.com/mozilla-services/syncstorage-rs/blob/master/docs/config.md"
code = "https://github.com/mozilla-services/syncstorage-rs"
fund = "https://donate.mozilla.org/en-GB/"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

sso = false
ldap = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

[resources]

    [resources.sources]
        [resources.sources.main]
        url = "https://github.com/mozilla-services/syncstorage-rs/archive/refs/tags/0.23.2.tar.gz"
        sha256 = "0c623c2497ca2e4688be3e889e817157f912837647a157dd6586fbc0fe7cf723"
        autoupdate.strategy = "latest_github_tag"
        autoupdate.needs_manual_tweaks = true

        [resources.sources.bookworm]
        amd64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.23.1/syncserver-0.23.1-bookworm-x86_64-unknown-linux-gnu.zst"
        amd64.sha256 = "71d9dbf8c5c3807b53ea8e1efbc95c7330010ea317c4da5e4d3dd9f3802679a4"
        autoupdate.asset.amd64 = "syncserver-\\d+(\\.\\d+)+-bookworm-x86_64-unknown-linux-gnu.zst"

        arm64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.23.1/syncserver-0.23.1-bookworm-aarch64-unknown-linux-gnu.zst"
        arm64.sha256 = "f3744c1a11851607b7a7201ddd7946bb331d2d61dbd681c63cb0158417a5182d"
        autoupdate.asset.arm64 = "syncserver-\\d+(\\.\\d+)+-bookworm-aarch64-unknown-linux-gnu.zst"

        armhf.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.23.1/syncserver-0.23.1-bookworm-armv7-unknown-linux-gnueabihf.zst"
        armhf.sha256 = "4783e42d95a5f7bab2265a51fc017cab3a781200c6315c28c3f237169dd31ba2"
        autoupdate.asset.armhf = "syncserver-\\d+(\\.\\d+)+-bookworm-armv7-unknown-linux-gnueabihf.zst"

        autoupdate.strategy = "latest_github_release"
        autoupdate.upstream = "https://github.com/YunoHost-Apps/syncstorage-rs-build"
        autoupdate.needs_manual_tweaks = true
        autoupdate.version_regex = "syncserver-(\\d+\\.\\d+\\.\\d+\\.?\\d{0,})"
        rename = "syncserver"
        in_subdir = false
        prefetch = false

        [resources.sources.trixie]
        amd64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.23.1/syncserver-0.23.1-trixie-x86_64-unknown-linux-gnu.zst"
        amd64.sha256 = "35c57e9960d69dba5d032a4ea89a40e077ed12b60ab12534f9639946c248d681"
        autoupdate.asset.amd64 = "syncserver-\\d+(\\.\\d+)+-trixie-x86_64-unknown-linux-gnu.zst"

        arm64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.23.1/syncserver-0.23.1-trixie-aarch64-unknown-linux-gnu.zst"
        arm64.sha256 = "735cb07269932d4c80f977f0cbcf11ef4bb64a1dda0216b2deb61485bfee365d"
        autoupdate.asset.arm64 = "syncserver-\\d+(\\.\\d+)+-trixie-aarch64-unknown-linux-gnu.zst"

        armhf.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.23.1/syncserver-0.23.1-trixie-armv7-unknown-linux-gnueabihf.zst"
        armhf.sha256 = "8b4d107df491b775e6125be805d2cd129706513444933b0a41d47672e767eb2d"
        autoupdate.asset.armhf = "syncserver-\\d+(\\.\\d+)+-trixie-armv7-unknown-linux-gnueabihf.zst"

        autoupdate.strategy = "latest_github_release"
        autoupdate.upstream = "https://github.com/YunoHost-Apps/syncstorage-rs-build"
        autoupdate.needs_manual_tweaks = true
        autoupdate.version_regex = "syncserver-(\\d+\\.\\d+\\.\\d+\\.?\\d{0,})"
        rename = "syncserver"
        in_subdir = false
        prefetch = false

        [resources.sources.diesel]
        amd64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/diesel-v2.3.10/diesel-v2.3.10-bookworm-x86_64-unknown-linux-gnu.zst"
        amd64.sha256 = "e7ebca2b872c1c994c85eb1846351335ce21c6dc4b9ba3f77c2dd98cd92bac65"
        autoupdate.asset.amd64 = "diesel-v\\d+(\\.\\d+)+-bookworm-x86_64-unknown-linux-gnu.zst"

        arm64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/diesel-v2.3.10/diesel-v2.3.10-bookworm-aarch64-unknown-linux-gnu.zst"
        arm64.sha256 = "28765d16b3c1d5c51aca8edfea83010b164f31c7e1b5b450cce60d5ad5895f9b"
        autoupdate.asset.arm64 = "diesel-v\\d+(\\.\\d+)+-bookworm-aarch64-unknown-linux-gnu.zst"

        armhf.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/diesel-v2.3.10/diesel-v2.3.10-bookworm-armv7-unknown-linux-gnueabihf.zst"
        armhf.sha256 = "236c5ded0b9f4259c513b4822cd0e464ab256a594ab7cd57365f68696ce6356c"
        autoupdate.asset.armhf = "diesel-v\\d+(\\.\\d+)+-bookworm-armv7-unknown-linux-gnueabihf.zst"

        autoupdate.strategy = "latest_github_release"
        autoupdate.upstream = "https://github.com/YunoHost-Apps/syncstorage-rs-build"
        autoupdate.needs_manual_tweaks = true
        autoupdate.version_regex = "diesel-v(\\d+\\.\\d+\\.\\d+)"
        rename = "diesel"
        in_subdir = false

        [resources.sources.uv]
        amd64.url = "https://github.com/astral-sh/uv/releases/download/0.11.21/uv-x86_64-unknown-linux-gnu.tar.gz"
        amd64.sha256 = "8c88519b0ef0af9801fcdee419bbb12116bd9e6b18e162ae093c932d8b264050"
        arm64.url = "https://github.com/astral-sh/uv/releases/download/0.11.21/uv-aarch64-unknown-linux-gnu.tar.gz"
        arm64.sha256 = "88e800834007cc5efd4675f166eb2a51e7e3ad19876d85fa8805a6fb5c922397"
        armhf.url = "https://github.com/astral-sh/uv/releases/download/0.11.21/uv-armv7-unknown-linux-gnueabihf.tar.gz"
        armhf.sha256 = "929440f991ccd8097e01be1ec831f673ac7bbf508e94819b4270f2873f69e658"

        in_subdir = true

        autoupdate.strategy = "latest_github_release"
        autoupdate.upstream = "https://github.com/astral-sh/uv"
        autoupdate.asset.amd64 = "^uv-x86_64-unknown-linux-gnu.tar.gz$"
        autoupdate.asset.arm64 = "^uv-aarch64-unknown-linux-gnu.tar.gz$"
        autoupdate.asset.armhf = "^uv-armv7-unknown-linux-gnueabihf.tar.gz$"


    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
    main.show_tile = false
    main.allowed = "visitors"
    main.protected = true

    [resources.ports]

    [resources.apt]
    packages = [
      "mariadb-server",
      "libmariadb-dev-compat", 
      "build-essential",
      "libssl-dev",
      "libcurl4",
      "pkg-config",
      "python3-dev"
    ]

    [resources.database]
    type = "mysql"
