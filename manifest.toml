#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "syncserver-rs"
name = "Firefox SyncStorage"

description.en = "Synchronize tabs, passwords, history etc. between your Firefox instances"
description.fr = "Synchronisez for onglets, mot de passe, historique etc entre vos Firefox"

version = "0.23.0~ynh3"

maintainers = ["orhtej2"]

[upstream]
license = "MPL-2.0"
website = "https://www.mozilla.org/en-GB/firefox/features/sync/"
admindoc = "https://github.com/mozilla-services/syncstorage-rs/blob/master/docs/config.md"
code = "https://github.com/mozilla-services/syncstorage-rs"
fund = "https://donate.mozilla.org/en-GB/"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

sso = false
ldap = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

[resources]

    [resources.sources]
        [resources.sources.main]
        url = "https://github.com/mozilla-services/syncstorage-rs/archive/refs/tags/0.23.0.tar.gz"
        sha256 = "d9d542aea5ca1e354ca7e0d28661461e15e58459440f503c7a15d93a4ecf64a4"
        autoupdate.strategy = "latest_github_tag"
        autoupdate.needs_manual_tweaks = true

        [resources.sources.bookworm]
        amd64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.23.0/syncserver-0.23.0-bookworm-x86_64-unknown-linux-gnu.zst"
        amd64.sha256 = "2fd3bd1fde908b548b916420227457abfdde83f2b93952df56b12c869bf5c21a"
        autoupdate.asset.amd64 = "syncserver-\\d+(\\.\\d+)+-bookworm-x86_64-unknown-linux-gnu.zst"

        arm64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.23.0/syncserver-0.23.0-bookworm-aarch64-unknown-linux-gnu.zst"
        arm64.sha256 = "9c1bc2c35a2e64380b4c8f2f51d6f6830192f4e390a005f31b70dcc052aa981b"
        autoupdate.asset.arm64 = "syncserver-\\d+(\\.\\d+)+-bookworm-aarch64-unknown-linux-gnu.zst"

        armhf.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.23.0/syncserver-0.23.0-bookworm-armv7-unknown-linux-gnueabihf.zst"
        armhf.sha256 = "fc92e53514eede00715208df809d12ee2b4e90cd6c486727544dc2fb5d1ff784"
        autoupdate.asset.armhf = "syncserver-\\d+(\\.\\d+)+-bookworm-armv7-unknown-linux-gnueabihf.zst"

        autoupdate.strategy = "latest_github_release"
        autoupdate.upstream = "https://github.com/YunoHost-Apps/syncstorage-rs-build"
        autoupdate.needs_manual_tweaks = true
        autoupdate.version_regex = "syncserver-(\\d+\\.\\d+\\.\\d+\\.?\\d{0,})"
        rename = "syncserver"
        in_subdir = false
        prefetch = false

        [resources.sources.trixie]
        amd64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.23.0/syncserver-0.23.0-trixie-x86_64-unknown-linux-gnu.zst"
        amd64.sha256 = "11b050fd0ae2d6789822bde2a8027f083565e52318ec70a1844c32a1983b925e"
        autoupdate.asset.amd64 = "syncserver-\\d+(\\.\\d+)+-trixie-x86_64-unknown-linux-gnu.zst"

        arm64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.23.0/syncserver-0.23.0-trixie-aarch64-unknown-linux-gnu.zst"
        arm64.sha256 = "5543ce260baaaf6979dd0228f6048acd74135b829fafa8ea2ae7eaf89bcdb960"
        autoupdate.asset.arm64 = "syncserver-\\d+(\\.\\d+)+-trixie-aarch64-unknown-linux-gnu.zst"

        armhf.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.23.0/syncserver-0.23.0-trixie-armv7-unknown-linux-gnueabihf.zst"
        armhf.sha256 = "4413315053034dff7b7e4d9565e97188f7c048ee4e179d87c22b7f32b1f441db"
        autoupdate.asset.armhf = "syncserver-\\d+(\\.\\d+)+-trixie-armv7-unknown-linux-gnueabihf.zst"

        autoupdate.strategy = "latest_github_release"
        autoupdate.upstream = "https://github.com/YunoHost-Apps/syncstorage-rs-build"
        autoupdate.needs_manual_tweaks = true
        autoupdate.version_regex = "syncserver-(\\d+\\.\\d+\\.\\d+\\.?\\d{0,})"
        rename = "syncserver"
        in_subdir = false
        prefetch = false

        [resources.sources.diesel]
        amd64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/diesel-v2.3.9/diesel-v2.3.9-bookworm-x86_64-unknown-linux-gnu.zst"
        amd64.sha256 = "65535390ff67ec1de2823241e43479731d49a985d69ba2eba36e5c99b56be97a"
        autoupdate.asset.amd64 = "diesel-v\\d+(\\.\\d+)+-bookworm-x86_64-unknown-linux-gnu.zst"

        arm64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/diesel-v2.3.9/diesel-v2.3.9-bookworm-aarch64-unknown-linux-gnu.zst"
        arm64.sha256 = "5e2b0cee32782b1bf7aa21923cdd2db89028c8c5a099304e8edebd2a89267223"
        autoupdate.asset.arm64 = "diesel-v\\d+(\\.\\d+)+-bookworm-aarch64-unknown-linux-gnu.zst"

        armhf.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/diesel-v2.3.9/diesel-v2.3.9-bookworm-armv7-unknown-linux-gnueabihf.zst"
        armhf.sha256 = "a69caad4fd8042070924eb931bd844143cb49bf1557bd9cd86f0133ed45338b4"
        autoupdate.asset.armhf = "diesel-v\\d+(\\.\\d+)+-bookworm-armv7-unknown-linux-gnueabihf.zst"

        autoupdate.strategy = "latest_github_release"
        autoupdate.upstream = "https://github.com/YunoHost-Apps/syncstorage-rs-build"
        autoupdate.needs_manual_tweaks = true
        autoupdate.version_regex = "diesel-v(\\d+\\.\\d+\\.\\d+)"
        rename = "diesel"
        in_subdir = false

        [resources.sources.uv]
        amd64.url = "https://github.com/astral-sh/uv/releases/download/0.11.16/uv-x86_64-unknown-linux-gnu.tar.gz"
        amd64.sha256 = "74947fe2c03315cf07e82ab3acc703eddef01aba4d5232a98e4c6825ec116131"
        arm64.url = "https://github.com/astral-sh/uv/releases/download/0.11.16/uv-aarch64-unknown-linux-gnu.tar.gz"
        arm64.sha256 = "8c9d0f0ee98166ae6ab198747519ba6f25db29d185bd2ae5960ecebc91a5c22a"
        armhf.url = "https://github.com/astral-sh/uv/releases/download/0.11.16/uv-armv7-unknown-linux-gnueabihf.tar.gz"
        armhf.sha256 = "71cf33cb511c9fe28ae261c0b4789e1fd9bb84d1bc68828db647b77305a15185"

        in_subdir = true

        autoupdate.strategy = "latest_github_release"
        autoupdate.upstream = "https://github.com/astral-sh/uv"
        autoupdate.asset.amd64 = "^uv-x86_64-unknown-linux-gnu.tar.gz$"
        autoupdate.asset.arm64 = "^uv-aarch64-unknown-linux-gnu.tar.gz$"
        autoupdate.asset.armhf = "^uv-armv7-unknown-linux-gnueabihf.tar.gz$"


    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
    main.show_tile = false
    main.allowed = "visitors"
    main.protected = true

    [resources.ports]

    [resources.apt]
    packages = [
      "mariadb-server",
      "libmariadb-dev-compat", 
      "build-essential",
      "libssl-dev",
      "libcurl4",
      "pkg-config",
      "python3-dev"
    ]

    [resources.database]
    type = "mysql"
