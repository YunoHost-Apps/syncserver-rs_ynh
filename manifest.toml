#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "syncserver-rs"
name = "Firefox SyncStorage"

description.en = "Synchronize tabs, passwords, history etc. between your Firefox instances"
description.fr = "Synchronisez for onglets, mot de passe, historique etc entre vos Firefox"

version = "0.22.0~ynh2"

maintainers = ["orhtej2"]

[upstream]
license = "MPL-2.0"
website = "https://www.mozilla.org/en-GB/firefox/features/sync/"
admindoc = "https://github.com/mozilla-services/syncstorage-rs/blob/master/docs/config.md"
code = "https://github.com/mozilla-services/syncstorage-rs"
fund = "https://donate.mozilla.org/en-GB/"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf", "i386"]
multi_instance = true

sso = false
ldap = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

[resources]

    [resources.sources]
        [resources.sources.main]
        url = "https://github.com/mozilla-services/syncstorage-rs/archive/refs/tags/0.22.0.tar.gz"
        sha256 = "bea3d15d52a70c18c7b87b06ab4db5afd019b11b94527241dd3ed393d1129864"
        autoupdate.strategy = "latest_github_tag"
        autoupdate.needs_manual_tweaks = true

        [resources.sources.bookworm]
        amd64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.22.0/syncserver-0.22.0-bookworm-x86_64-unknown-linux-gnu.zst"
        amd64.sha256 = "4584429c664dceb62769dd233b64161c3a8c297fe645bbdc6adf636dfbd44f81"
        autoupdate.asset.amd64 = "syncserver-\\d+(\\.\\d+)+-bookworm-x86_64-unknown-linux-gnu.zst"

        arm64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.22.0/syncserver-0.22.0-bookworm-aarch64-unknown-linux-gnu.zst"
        arm64.sha256 = "ec5ec03465cc56b56e4c9cdc1f9581b505cba2aeaa61630a15acfb7bfc6aaf7a"
        autoupdate.asset.arm64 = "syncserver-\\d+(\\.\\d+)+-bookworm-aarch64-unknown-linux-gnu.zst"

        armhf.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.22.0/syncserver-0.22.0-bookworm-armv7-unknown-linux-gnueabihf.zst"
        armhf.sha256 = "22f429f0b8a19af5481781a83b5096105746a4570f5292d33a3e4e06bafdcf83"
        autoupdate.asset.armhf = "syncserver-\\d+(\\.\\d+)+-bookworm-armv7-unknown-linux-gnueabihf.zst"

        i386.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.22.0/syncserver-0.22.0-bookworm-i686-unknown-linux-gnu.zst"
        i386.sha256 = "113ab4fb04beec81602a047854c218d1a90bbd2c456edf3b25c261203793a9e4"
        autoupdate.asset.i386 = "syncserver-\\d+(\\.\\d+)+-bookworm-i686-unknown-linux-gnu.zst"

        autoupdate.strategy = "latest_github_release"
        autoupdate.upstream = "https://github.com/YunoHost-Apps/syncstorage-rs-build"
        autoupdate.needs_manual_tweaks = true
        autoupdate.version_regex = "syncserver-(\\d+\\.\\d+\\.\\d+\\.?\\d{0,})"
        rename = "syncserver"
        in_subdir = false
        prefetch = false

        [resources.sources.trixie]
