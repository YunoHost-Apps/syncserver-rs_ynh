        autoupdate.strategy = "latest_github_release"
        autoupdate.upstream = "https://github.com/astral-sh/uv"
        autoupdate.asset.amd64 = "^uv-x86_64-unknown-linux-gnu.tar.gz$"
        autoupdate.asset.arm64 = "^uv-aarch64-unknown-linux-gnu.tar.gz$"
        autoupdate.asset.armhf = "^uv-armv7-unknown-linux-gnueabihf.tar.gz$"

        [resources.sources.requirements]
        url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.24.0-postgres/syncserver-0.24.0-requirements.tar.zst"
        sha256 = "37b5d00665c2f965bd5bc0fd45e6be992af229d878443679e00ee6f9b588bbcc"
        autoupdate.asset = "syncserver-\\d+(\\.\\d+)+-requirements\\.tar\\.zst"

        autoupdate.strategy = "latest_github_release"
        autoupdate.upstream = "https://github.com/YunoHost-Apps/syncstorage-rs-build"
        autoupdate.needs_manual_tweaks = true
        autoupdate.version_regex = "syncserver-(\\d+\\.\\d+\\.\\d+\\.?\\d{0,})"
        in_subdir = false

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
    main.show_tile = false
    main.allowed = "visitors"
    main.protected = true

    [resources.ports]

    [resources.apt]
    packages = [
      "postgresql",
      "libmariadb-dev-compat", 
      "build-essential",
      "libssl-dev",
      "libcurl4",
      "pkg-config",
      "python3-dev",
    ]

    [resources.database]
    type = "postgresql"
