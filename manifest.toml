        arm64.sha256 = "45ed83dccde68768ea485e5729cfd977eb84752db4e1228571bbf470a4029cb6"
        autoupdate.asset.arm64 = "diesel-v\\d+(\\.\\d+)+-bookworm-aarch64-unknown-linux-gnu.zst"

        armhf.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/diesel-v2.3.14-postgres/diesel-v2.3.14-bookworm-armv7-unknown-linux-gnueabihf.zst"
        armhf.sha256 = "b5a41b0c52a120f0d4ddca89e65e2ac354543e31df5183daa23c940bde0f07a4"
        autoupdate.asset.armhf = "diesel-v\\d+(\\.\\d+)+-bookworm-armv7-unknown-linux-gnueabihf.zst"

        autoupdate.strategy = "latest_github_release"
        autoupdate.upstream = "https://github.com/YunoHost-Apps/syncstorage-rs-build"
        autoupdate.needs_manual_tweaks = true
        autoupdate.version_regex = "diesel-v(\\d+\\.\\d+\\.\\d+)-postgres"
        rename = "diesel"
        in_subdir = false

        [resources.sources.uv]
        amd64.url = "https://github.com/astral-sh/uv/releases/download/0.13.5/uv-x86_64-unknown-linux-gnu.tar.gz"
        amd64.sha256 = "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
        arm64.url = "https://github.com/astral-sh/uv/releases/download/0.13.5/uv-aarch64-unknown-linux-gnu.tar.gz"
