#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "syncserver-rs"
name = "Firefox SyncStorage"

description.en = "Synchronize tabs, passwords, history etc. between your Firefox instances"
description.fr = "Synchronisez for onglets, mot de passe, historique etc entre vos Firefox"

version = "0.25.2~ynh1"

maintainers = ["orhtej2"]

[upstream]
license = "MPL-2.0"
website = "https://www.mozilla.org/en-GB/firefox/features/sync/"
admindoc = "https://github.com/mozilla-services/syncstorage-rs/blob/master/docs/config.md"
code = "https://github.com/mozilla-services/syncstorage-rs"
fund = "https://donate.mozilla.org/en-GB/"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

sso = false
ldap = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

[resources]

    [resources.sources]
        [resources.sources.main]
        url = "https://github.com/mozilla-services/syncstorage-rs/archive/refs/tags/0.25.2.tar.gz"
        sha256 = "73743cd4e8dbba86347b429a5ae6aa5f48ff11f7aa34f7d88d6faf9bd23613b5"
        autoupdate.strategy = "latest_github_tag"
        autoupdate.needs_manual_tweaks = true

        [resources.sources.bookworm]
        amd64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.25.1-postgres/syncserver-0.25.1-bookworm-x86_64-unknown-linux-gnu.zst"
        amd64.sha256 = "39d65267b0403f51520510821eb9832ec3c77d29b7f13f0744f5f410bfdb1793"
        autoupdate.asset.amd64 = "syncserver-\\d+(\\.\\d+)+-bookworm-x86_64-unknown-linux-gnu.zst"

        arm64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.25.1-postgres/syncserver-0.25.1-bookworm-aarch64-unknown-linux-gnu.zst"
        arm64.sha256 = "4be6d90beafda8ad6f2d5026ea98b9edf4e4605f8c5b153f78243aa7b6e20bcf"
        autoupdate.asset.arm64 = "syncserver-\\d+(\\.\\d+)+-bookworm-aarch64-unknown-linux-gnu.zst"

        armhf.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.25.1-postgres/syncserver-0.25.1-bookworm-armv7-unknown-linux-gnueabihf.zst"
        armhf.sha256 = "159dab58ea3c09e08046655927e7bc175fba3e44ffda67219038987883cd6390"
        autoupdate.asset.armhf = "syncserver-\\d+(\\.\\d+)+-bookworm-armv7-unknown-linux-gnueabihf.zst"

        autoupdate.strategy = "latest_github_release"
        autoupdate.upstream = "https://github.com/YunoHost-Apps/syncstorage-rs-build"
        autoupdate.needs_manual_tweaks = true
        autoupdate.version_regex = "syncserver-(\\d+\\.\\d+\\.\\d+\\.?\\d{0,})-postgres"
        rename = "syncserver"
        in_subdir = false
        prefetch = false

        [resources.sources.trixie]
        amd64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.25.1-postgres/syncserver-0.25.1-trixie-x86_64-unknown-linux-gnu.zst"
        amd64.sha256 = "18a59bdf41d76b79213a39102489f1503fffcdc30e08553654b81cf2495a68e6"
        autoupdate.asset.amd64 = "syncserver-\\d+(\\.\\d+)+-trixie-x86_64-unknown-linux-gnu.zst"

        arm64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.25.1-postgres/syncserver-0.25.1-trixie-aarch64-unknown-linux-gnu.zst"
        arm64.sha256 = "f44179e4e05c85865b9727a88ac9e0318c9355205d44e189fb2e289bd3ea00d8"
        autoupdate.asset.arm64 = "syncserver-\\d+(\\.\\d+)+-trixie-aarch64-unknown-linux-gnu.zst"

        armhf.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/syncserver-0.25.1-postgres/syncserver-0.25.1-trixie-armv7-unknown-linux-gnueabihf.zst"
        armhf.sha256 = "16b1b0b76efaed8f394703a55f10cdc2da5dfcb95f9fe4fe48ee6661b8307ade"
        autoupdate.asset.armhf = "syncserver-\\d+(\\.\\d+)+-trixie-armv7-unknown-linux-gnueabihf.zst"

        autoupdate.strategy = "latest_github_release"
        autoupdate.upstream = "https://github.com/YunoHost-Apps/syncstorage-rs-build"
        autoupdate.needs_manual_tweaks = true
        autoupdate.version_regex = "syncserver-(\\d+\\.\\d+\\.\\d+\\.?\\d{0,})-postgres"
        rename = "syncserver"
        in_subdir = false
        prefetch = false

        [resources.sources.diesel]
        amd64.url = "https://github.com/YunoHost-Apps/syncstorage-rs-build/releases/download/diesel-v2.3.14-postgres/diesel-v2.3.14-bookworm-x86_64-unknown-linux-gnu.zst"
        amd64.sha256 = "ec7eae2961be2ba32af1517da53e679fe8ed2bc8e5139ed890b3b39815d080a0"
        autoupdate.asset.amd64 = "diesel-v\\d+(\\.\\d+)+-bookworm-x86_64-unknown-linux-gnu.zst"

