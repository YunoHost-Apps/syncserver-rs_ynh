        i386.sha256 = "1ed6126954fc26c18ed819a13e8c77ecc8288747a7b79e05a51690a27725dff8"
        autoupdate.asset.i386 = "syncserver-\\d+(\\.\\d+)+-bookworm-i686-unknown-linux-gnu.zst"

